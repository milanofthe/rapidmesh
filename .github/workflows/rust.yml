name: rust

# Lint + Test-Gate für den Rust-Workspace: cargo clippy (Warnungen = Fehler)
# und die volle Testsuite. Der Corpus (report/corpus.py) bleibt bewusst
# lokal — er ist die Benchmark-Wahrheit, kein CI-Gate (Laufzeit).
#
# Ausgenommen ist EIN Test: cylinder_coarse_interior_terminates ist ein
# WALL-CLOCK-Budget-Regressionstest (30 s auf der Referenzmaschine); auf
# geteilten CI-Runnern ist ein Zeitbudget kein stabiles Signal. Er läuft
# lokal in der normalen Suite.

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "python/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "python/src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast -- --skip cylinder_coarse_interior_terminates
