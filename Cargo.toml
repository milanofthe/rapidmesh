[workspace]
resolver = "2"
members = [
    "crates/rapidmesh-exact",
    "crates/rapidmesh-geom",
    "crates/rapidmesh-csg",
    "crates/rapidmesh-brep",
    "crates/rapidmesh-tet",
    "crates/rapidmesh-topo",
    "crates/rapidmesh",
    "crates/rapidmesh-testutil",
    "crates/rapidmesh-wasm",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
rapidmesh-exact = { path = "crates/rapidmesh-exact" }
rapidmesh-geom = { path = "crates/rapidmesh-geom" }
rapidmesh-testutil = { path = "crates/rapidmesh-testutil" }
rapidmesh-csg = { path = "crates/rapidmesh-csg" }
rapidmesh-brep = { path = "crates/rapidmesh-brep" }
rapidmesh-tet = { path = "crates/rapidmesh-tet" }
rapidmesh-topo = { path = "crates/rapidmesh-topo" }
geometry-predicates = "0.3"
rayon = "1"
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numeric hot loops (quality kernels, projection oracles, predicates) gain
# real throughput from cross-crate inlining; thin LTO + one codegen unit is
# near fat-LTO speed at a fraction of the link time.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
